[project]
name = "meta-tags-parser"
version = "2.0.2"
description = "Fast and modern meta tags parser (og, twitter, title, description, etc) with snippet support"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Denis Anikin", email = "ad@xfenix.ru" }]
requires-python = ">=3.10"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["httpx>=0.28.1", "selectolax>=0.3.33"]

[project.urls]
Documentation = "https://github.com/xfenix/meta-tags-parser"

[dependency-groups]
dev = [
    "pytest>=8.4.1",
    "pytest-cov>=6.2.1",
    "Faker>=37.5.3",
    "pytest-asyncio>=1.1.0",
    "pylint>=3.3.8",
    "mypy>=1.17.1",
    "pytest-xdist>=3.8.0",
    "ruff>=0.12.8",
    "hypothesis>=6.138.0",
    "community-of-python-flake8-plugin>=0.6.0",
    "flake8-pyproject>=1.2.4",
    "auto-typing-final>=1.0.4",
    "polyfactory>=2.22.5",
]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
addopts = "-n auto --strict-markers --strict-config --cov=meta_tags_parser --cov=tests --cov-report term-missing"
testpaths = ["tests"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error"]

[tool.ruff]
fix = true
unsafe-fixes = true
line-length = 120
extend-exclude = ["benchmark"]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = ["ALL"]
external = ["COP"]
ignore = [
    "EM",
    "FBT",
    "TRY003",
    "D1",
    "D203",
    "D213",
    "G004",
    "FA",
    "COM812",
    "ISC001",
]

[tool.ruff.lint.isort]
no-lines-before = ["standard-library", "local-folder"]
known-third-party = []
known-local-folder = []
lines-after-imports = 2

[tool.ruff.lint.extend-per-file-ignores]
# RUF001/RUF002/RUF003 flag non latin characters as ambiguous, but multilingual page content is
# exactly what this parser exists for, so it is expected inside fixtures, corpus data and expectations
"tests/**.py" = ["S101", "S311", "PLR2004", "RUF001", "RUF002", "RUF003"]
"scripts/corpus_locales.py" = ["RUF001", "RUF002", "RUF003"]
"scripts/generate_html_corpus.py" = ["S311", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
strict = true

[tool.flake8]
select = ["COP"]
exclude = [".venv", ".cache", "benchmark"]
# web_url/options and the dataclass field names below are the stable public API (kept short
# intentionally); renaming any of them is a breaking change for downstream consumers.
per-file-ignores = [
    "meta_tags_parser/public.py:COP006",
    "meta_tags_parser/parse.py:COP006",
    "meta_tags_parser/snippets.py:COP006",
    "meta_tags_parser/structs.py:COP004",
]

[tool.coverage.report]
exclude_also = ["if typing.TYPE_CHECKING:"]
